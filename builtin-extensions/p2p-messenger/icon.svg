<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Background circle -->
  <circle cx="64" cy="64" r="56" fill="#667eea"/>
  <!-- Chat bubble 1 (left) -->
  <rect x="28" y="36" width="40" height="32" rx="6" ry="6" fill="white"/>
  <polygon points="36,68 36,80 48,68" fill="white"/>
  <!-- Chat bubble 2 (right) -->
  <rect x="60" y="48" width="40" height="32" rx="6" ry="6" fill="white" opacity="0.9"/>
  <polygon points="92,80 92,92 80,80" fill="white" opacity="0.9"/>
  <!-- Connection dots in bubble 1 -->
  <circle cx="40" cy="52" r="3" fill="#667eea"/>
  <circle cx="52" cy="52" r="3" fill="#667eea"/>
  <circle cx="64" cy="52" r="3" fill="#667eea"/>
  <!-- P2P arrow -->
  <line x1="72" y1="64" x2="88" y2="64" stroke="#764ba2" stroke-width="3" stroke-linecap="round"/>
  <polyline points="82,58 88,64 82,70" stroke="#764ba2" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
